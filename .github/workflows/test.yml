name: Checks
on: [push, pull_request]
jobs:
  linux-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install --no-deps -e ./backend
      - run: python -m pytest backend/tests/test_agent_protocol.py backend/tests/test_agent_linux.py -q
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install --no-deps -e ./backend
      - run: python -m ruff check backend scripts
      - run: python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.lock
      - run: .venv/bin/python -m pip install --no-deps -e ./backend
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend exec playwright install --with-deps chrome
      - run: pnpm --dir frontend test:e2e
