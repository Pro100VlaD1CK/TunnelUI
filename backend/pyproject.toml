[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnelui"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0,<2.1", "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26", "cryptography>=44,<47", "tomlkit>=0.13,<1", "httpx>=0.28,<1",
  "dbus-next>=0.2.3,<1; sys_platform == 'linux'"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
tunnelui = "tunnelui.cli:main"
tunnelui-agent = "tunnelui.agent.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
